name: Release

on:
  push:
    tags:
      # Full versions only: the floating major tag (v2) maintained below must
      # never start a release run of its own.
      - 'v*.*.*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.9'

jobs:
  # A tag must never publish a release whose tests fail. goreleaser runs only
  # after the full Go suite and the binary smoke test pass on the tagged commit.
  test:
    name: Test before release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go tests
        run: go test -race -timeout 20m ./...

      - name: Smoke test the built binary
        env:
          SMOKE_REQUIRE_SQLITE: '1'
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update && sudo apt-get install -y sqlite3; }
          go build -o "$RUNNER_TEMP/hitspec" ./cmd/hitspec
          .github/scripts/smoke.sh "$RUNNER_TEMP/hitspec"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned: an unpinned `latest` would let the next goreleaser major
          # silently break the release (removed deprecated properties, etc.).
          # Bump deliberately and re-run `goreleaser check` when upgrading.
          version: v2.13.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Keep the floating major tag (v2, v3, ...) that `uses: owner/hitspec@v2`
      # resolves to pointed at the latest stable release. Prereleases
      # (v2.21.0-rc.1) and other tags are ignored. Only the major tag derived
      # from this release is touched: older majors such as v1 stay as they are.
      - name: Update floating major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$TAG is not a stable release tag; leaving the floating major tag alone"
            exit 0
          fi
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Release $TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $TAG ($GITHUB_SHA)"
