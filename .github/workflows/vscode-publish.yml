name: VS Code extension

# Packages apps/vscode into a .vsix on every run and, when the publishing
# credentials exist as repository secrets, publishes it:
#   VSCE_PAT  Visual Studio Marketplace token (publisher "hitspec")
#   OVSX_PAT  Open VSX token
# Without a secret the matching publish step is skipped, so this workflow is
# safe to run before the credentials are configured (it just builds the .vsix).
# Trigger: push a tag vscode-v<version> (must match apps/vscode/package.json),
# or run it manually.

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "vscode-v$version" || { echo "tag $TAG does not match package.json version $version" >&2; exit 1; }

      - name: Install vsce
        run: npm install --no-audit --no-fund

      - name: Package
        run: npx vsce package --out hitspec.vsix

      - name: Upload the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hitspec-vsix
          path: apps/vscode/hitspec.vsix

      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != '' && startsWith(github.ref, 'refs/tags/vscode-v')
        run: npx vsce publish --packagePath hitspec.vsix --pat "$VSCE_PAT"

      - name: Skipped Marketplace publish
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT is not set; skipping the Visual Studio Marketplace publish (needs the maintainer's credentials)."

      - name: Publish to Open VSX
        if: env.OVSX_PAT != '' && startsWith(github.ref, 'refs/tags/vscode-v')
        run: npx --yes ovsx@0.10.1 publish hitspec.vsix --pat "$OVSX_PAT"

      - name: Skipped Open VSX publish
        if: env.OVSX_PAT == ''
        run: echo "OVSX_PAT is not set; skipping the Open VSX publish (needs the maintainer's credentials)."
