name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26.9'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          # Authenticated release lookups; the anonymous per-IP limit is shared
          # with every job on the runner and fails builds at random.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Build before `task generate` so a fresh clone (and `go install`)
      # never depends on generated, untracked files.
      - name: Build from a clean checkout
        run: go build ./... && go build -o /tmp/hitspec ./cmd/hitspec

      - name: Generate code
        run: task generate

      - name: Check generated files are committed
        run: git diff --exit-code

      - name: Build Go binary
        run: task go:build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          # Authenticated release lookups; the anonymous per-IP limit is shared
          # with every job on the runner and fails builds at random.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code
        run: task generate

      # Use golangci-lint action for its caching benefits
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Run go vet
        run: go vet ./...

      - name: Check go fmt
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          }

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          # Authenticated release lookups; the anonymous per-IP limit is shared
          # with every job on the runner and fails builds at random.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code
        run: task generate

      - name: Run Go tests
        run: go test -v -race -timeout 10m ./...

  # Root cause of a silent `hitspec run` shipping for six releases: nothing ran
  # the built binary and looked at its stdout. This job does, end to end:
  # init -> validate -> mock -> run for a fresh project, then every example.
  smoke:
    name: Smoke (binary, examples, docs snippets)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build the binary
        run: go build -o "$RUNNER_TEMP/hitspec" ./cmd/hitspec

      - name: Lint shell scripts
        run: shellcheck .github/scripts/*.sh

      # The database example needs the sqlite3 CLI to create its seed database.
      - name: Ensure sqlite3
        run: command -v sqlite3 >/dev/null || { sudo apt-get update && sudo apt-get install -y sqlite3; }

      - name: Smoke test (init, validate, mock, run, every example)
        env:
          SMOKE_REQUIRE_SQLITE: '1'
        run: .github/scripts/smoke.sh "$RUNNER_TEMP/hitspec"

      # Every ```http block in the docs, README and llms.txt goes through the
      # real parser, and `hitspec <command> --flag` lines in shell blocks are
      # checked against the binary's --help. Mark an intentionally partial
      # block with {/* docsnippets: skip */} (mdx) or <!-- docsnippets: skip -->.
      - name: Docs snippets
        run: go run ./tools/docsnippets -bin "$RUNNER_TEMP/hitspec"

  # The suite has only ever run on Linux. These jobs report how it fares on the
  # other release platforms without blocking merges yet; once they are green
  # (or their failures fixed) drop continue-on-error to make them required.
  test-os:
    name: Test (${{ matrix.os }}, non-blocking)
    runs-on: ${{ matrix.os }}
    needs: build
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go tests
        run: go test -timeout 20m ./...

  # Black-box studio TUI specs driven through a real PTY by glyphrun
  # (https://github.com/abdul-hamid-achik/glyphrun, public releases). Non-blocking
  # until it has a track record on CI runners.
  e2e:
    name: Studio e2e (glyphrun, non-blocking)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    timeout-minutes: 25
    env:
      GLYPH_VERSION: '0.22.0'
      GLYPH_SHA256: '1c045cb2c03616f7d4f18eafa7e781f6080cadafa25cd7a92ec8128afd6b29ba'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install glyph
        run: |
          set -euo pipefail
          url="https://github.com/abdul-hamid-achik/glyphrun/releases/download/v${GLYPH_VERSION}/glyph_${GLYPH_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/glyph.tar.gz" "$url"
          echo "${GLYPH_SHA256}  $RUNNER_TEMP/glyph.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/glyph-bin"
          tar -xzf "$RUNNER_TEMP/glyph.tar.gz" -C "$RUNNER_TEMP/glyph-bin" glyph
          echo "$RUNNER_TEMP/glyph-bin" >> "$GITHUB_PATH"

      - name: Run studio specs
        run: glyph run e2e/flows/*.yml --format md

      - name: Upload glyph artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glyph-runs
          path: e2e/.glyphrun/runs
          if-no-files-found: ignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          # Authenticated release lookups; the anonymous per-IP limit is shared
          # with every job on the runner and fails builds at random.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate code
        run: task generate

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # Blocks on HIGH severity findings (>= medium confidence) after the
      # triaged exclusions documented in the script; the full medium-and-up
      # report is uploaded below for reading, not gating.
      - name: Run gosec
        run: .github/scripts/gosec.sh gosec-results.json

      - name: Upload gosec results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-results
          path: gosec-results.json
          if-no-files-found: ignore

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: '3.x'
          # Authenticated release lookups; the anonymous per-IP limit is shared
          # with every job on the runner and fails builds at random.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Mintlify docs (broken links + MDX syntax)
        run: task docs:check

  # Exercises action.yml from this checkout on every OS it supports. The action
  # installs the latest *released* hitspec, so this validates the action script
  # (install, checksum, globs, report handling, exit codes) against a real
  # release. The target is a local static server, so the job is fully offline.
  action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Start local fixture server
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          nohup "$PY" -m http.server 8765 --bind 127.0.0.1 --directory .github/action-test/site >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ok.json >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "fixture server did not start" >&2
          exit 1

      - name: Run passing tests via the action (glob, junit, default report file)
        id: pass
        uses: ./
        with:
          files: .github/action-test/pass/*.http
          output: junit
          timeout: '5000'

      - name: Check report-file output
        shell: bash
        env:
          REPORT_FILE: ${{ steps.pass.outputs.report-file }}
          EXIT_CODE: ${{ steps.pass.outputs.exit-code }}
        run: |
          test "$REPORT_FILE" = "hitspec-results.xml" || { echo "unexpected report-file: '$REPORT_FILE'" >&2; exit 1; }
          test -s "$REPORT_FILE" || { echo "report file missing or empty" >&2; exit 1; }
          test "$EXIT_CODE" = "0" || { echo "unexpected exit-code: '$EXIT_CODE'" >&2; exit 1; }

      - name: Run a failing test via the action
        id: failing
        uses: ./
        continue-on-error: true
        with:
          files: .github/action-test/fail/
          timeout: 5s

      - name: Assert the failing run failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "failure" || { echo "expected the step to fail, outcome was '$OUTCOME'" >&2; exit 1; }
          test "$EXIT_CODE" = "1" || { echo "expected exit-code 1, got '$EXIT_CODE'" >&2; exit 1; }

      - name: A glob matching nothing is an error
        id: noglob
        uses: ./
        continue-on-error: true
        with:
          files: .github/action-test/missing/*.http

      - name: Assert the empty glob failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.noglob.outcome }}
        run: test "$OUTCOME" = "failure" || { echo "expected failure, outcome was '$OUTCOME'" >&2; exit 1; }
