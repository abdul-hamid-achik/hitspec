name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.12'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: '3.x'

      - name: Generate code
        run: task generate

      - name: Build Go binary
        run: task go:build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: '3.x'

      - name: Generate code
        run: task generate

      # Use golangci-lint action for its caching benefits
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2

      - name: Run go vet
        run: go vet ./...

      - name: Check go fmt
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          }

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: '3.x'

      - name: Generate code
        run: task generate

      - name: Run Go tests
        run: go test -v -race -timeout 10m -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: '3.x'

      - name: Generate code
        run: task generate

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -severity=medium -confidence=medium -fmt=json -out=gosec-results.json ./... || true

      - name: Upload gosec results
        uses: actions/upload-artifact@v7
        with:
          name: gosec-results
          path: gosec-results.json

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: '3.x'

      - name: Check Mintlify docs (broken links + MDX syntax)
        run: task docs:check
