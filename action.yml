name: 'hitspec'
description: 'Run API tests with hitspec - plain text HTTP testing'
author: 'Abdul Hamid Achik'
branding:
  icon: 'zap'
  color: 'blue'

inputs:
  files:
    description: 'Files or directories to test (required)'
    required: true
  env:
    description: 'Environment name'
    required: false
    default: 'dev'
  env-file:
    description: 'Path to .env file for variable interpolation'
    required: false
  output:
    description: 'Output format (console, json, junit, tap)'
    required: false
    default: 'junit'
  output-file:
    description: 'Write output to file'
    required: false
  tags:
    description: 'Filter by tags (comma-separated)'
    required: false
  name:
    description: 'Filter by request name pattern'
    required: false
  timeout:
    description: 'Global timeout in milliseconds'
    required: false
  parallel:
    description: 'Run requests in parallel'
    required: false
    default: 'false'
  concurrency:
    description: 'Max concurrent requests when parallel is enabled'
    required: false
  bail:
    description: 'Stop on first failure'
    required: false
    default: 'false'
  verbose:
    description: 'Show detailed output'
    required: false
    default: 'false'
  insecure:
    description: 'Disable SSL certificate validation'
    required: false
    default: 'false'
  proxy:
    description: 'Proxy URL for requests'
    required: false
  stress:
    description: 'Enable stress testing mode'
    required: false
    default: 'false'
  duration:
    description: 'Stress test duration (e.g., 30s, 1m, 5m)'
    required: false
    default: '30s'
  rate:
    description: 'Target requests per second for stress testing'
    required: false
    default: '10'
  vus:
    description: 'Number of virtual users (alternative to rate)'
    required: false
  max-vus:
    description: 'Maximum concurrent requests in stress mode'
    required: false
  think-time:
    description: 'Think time between requests per VU'
    required: false
  ramp-up:
    description: 'Ramp-up time to reach target rate/VUs'
    required: false
  threshold:
    description: 'Pass/fail thresholds (e.g., "p95<200ms,errors<0.1%")'
    required: false
  profile:
    description: 'Stress profile name from hitspec.yaml'
    required: false
  version:
    description: 'hitspec version to use (e.g., v0.9.4 or latest)'
    required: false
    default: 'latest'

outputs:
  exit-code:
    description: 'Exit code from hitspec (0 = success, non-zero = failure)'
    value: ${{ steps.run-tests.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Install hitspec
      shell: bash
      # Inputs reach the script only through env (never ${{ }} inside the
      # script), so an input value cannot inject shell code.
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -eu

        VERSION="$INPUT_VERSION"

        # Resolve 'latest' to actual version
        if [ "$VERSION" = "latest" ]; then
          echo "Fetching latest version..."
          VERSION=$(curl -fsSL https://api.github.com/repos/abdul-hamid-achik/hitspec/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to fetch latest version"
            exit 1
          fi
          echo "Latest version: $VERSION"
        fi
        case "$VERSION" in
          v*) ;;
          *) VERSION="v${VERSION}" ;;
        esac
        if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9][0-9A-Za-z._+-]*$'; then
          echo "::error::Invalid version: $VERSION"
          exit 1
        fi

        # Detect OS
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        # Detect architecture and normalize
        ARCH=$(uname -m)
        case $ARCH in
          x86_64)
            ARCH="amd64"
            ;;
          aarch64|arm64)
            ARCH="arm64"
            ;;
          *)
            echo "::error::Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

        echo "Platform: ${OS}_${ARCH}"

        # Strip 'v' prefix for download URL (goreleaser uses version without v)
        VERSION_NUM="${VERSION#v}"

        # Construct download URL
        if [ "$OS" = "windows" ]; then
          ARCHIVE="hitspec_${VERSION_NUM}_${OS}_${ARCH}.zip"
        else
          ARCHIVE="hitspec_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        fi

        BASE_URL="https://github.com/abdul-hamid-achik/hitspec/releases/download/${VERSION}"
        echo "Downloading: ${BASE_URL}/${ARCHIVE}"

        DL=$(mktemp -d)
        curl -fsSL --retry 3 "${BASE_URL}/${ARCHIVE}" -o "$DL/$ARCHIVE"

        # Verify the archive against the release checksums when published.
        if curl -fsSL --retry 3 "${BASE_URL}/checksums.txt" -o "$DL/checksums.txt"; then
          EXPECTED=$(awk -v f="$ARCHIVE" '$2 == f || $2 == "*" f { print $1 }' "$DL/checksums.txt" | head -n 1)
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum < "$DL/$ARCHIVE" | awk '{ print $1 }')
          else
            ACTUAL=$(shasum -a 256 < "$DL/$ARCHIVE" | awk '{ print $1 }')
          fi
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch for $ARCHIVE"
            exit 1
          fi
          echo "Checksum OK"
        else
          echo "::warning::No checksums.txt published for ${VERSION}; skipping verification"
        fi

        # Extract
        INSTALL_DIR="/usr/local/bin"
        if [ "$OS" = "windows" ]; then
          unzip -o "$DL/$ARCHIVE" hitspec.exe -d "$INSTALL_DIR"
        else
          tar -xzf "$DL/$ARCHIVE" -C "$INSTALL_DIR" hitspec
        fi
        rm -rf "$DL"

        # Verify installation
        hitspec version
        echo "hitspec installed successfully"

    - name: Run hitspec tests
      id: run-tests
      shell: bash
      # Inputs are passed through env and argv is a bash array: no eval, so
      # every value stays a literal argument. Semantics match the original
      # action: `files` is split on whitespace and globs are expanded.
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_ENV_FILE: ${{ inputs.env-file }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_BAIL: ${{ inputs.bail }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_INSECURE: ${{ inputs.insecure }}
        INPUT_PROXY: ${{ inputs.proxy }}
        INPUT_STRESS: ${{ inputs.stress }}
        INPUT_DURATION: ${{ inputs.duration }}
        INPUT_RATE: ${{ inputs.rate }}
        INPUT_VUS: ${{ inputs.vus }}
        INPUT_MAX_VUS: ${{ inputs.max-vus }}
        INPUT_THINK_TIME: ${{ inputs.think-time }}
        INPUT_RAMP_UP: ${{ inputs.ramp-up }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_PROFILE: ${{ inputs.profile }}
      run: |
        set -u

        # Word-split and glob-expand `files`, as the original `eval` did.
        # shellcheck disable=SC2206
        files=( $INPUT_FILES )

        args=(hitspec run "${files[@]}")

        # Add standard options
        args+=(--env "$INPUT_ENV")
        args+=(--output "$INPUT_OUTPUT")
        args+=(--no-color)

        # Add optional flags
        if [ -n "$INPUT_ENV_FILE" ]; then
          args+=(--env-file "$INPUT_ENV_FILE")
        fi

        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          args+=(--output-file "$INPUT_OUTPUT_FILE")
        fi

        if [ -n "$INPUT_TAGS" ]; then
          args+=(--tags "$INPUT_TAGS")
        fi

        if [ -n "$INPUT_NAME" ]; then
          args+=(--name "$INPUT_NAME")
        fi

        if [ -n "$INPUT_TIMEOUT" ]; then
          args+=(--timeout "$INPUT_TIMEOUT")
        fi

        if [ "$INPUT_PARALLEL" = "true" ]; then
          args+=(--parallel)
          if [ -n "$INPUT_CONCURRENCY" ]; then
            args+=(--concurrency "$INPUT_CONCURRENCY")
          fi
        fi

        if [ "$INPUT_BAIL" = "true" ]; then
          args+=(--bail)
        fi

        if [ "$INPUT_VERBOSE" = "true" ]; then
          args+=(--verbose)
        fi

        if [ "$INPUT_INSECURE" = "true" ]; then
          args+=(--insecure)
        fi

        if [ -n "$INPUT_PROXY" ]; then
          args+=(--proxy "$INPUT_PROXY")
        fi

        if [ "$INPUT_STRESS" = "true" ]; then
          args+=(--stress)
          args+=(--duration "$INPUT_DURATION")
          args+=(--rate "$INPUT_RATE")
          args+=(--no-progress)

          if [ -n "$INPUT_VUS" ]; then
            args+=(--vus "$INPUT_VUS")
          fi

          if [ -n "$INPUT_MAX_VUS" ]; then
            args+=(--max-vus "$INPUT_MAX_VUS")
          fi

          if [ -n "$INPUT_THINK_TIME" ]; then
            args+=(--think-time "$INPUT_THINK_TIME")
          fi

          if [ -n "$INPUT_RAMP_UP" ]; then
            args+=(--ramp-up "$INPUT_RAMP_UP")
          fi

          if [ -n "$INPUT_THRESHOLD" ]; then
            args+=(--threshold "$INPUT_THRESHOLD")
          fi

          if [ -n "$INPUT_PROFILE" ]; then
            args+=(--profile "$INPUT_PROFILE")
          fi
        fi

        printf 'Running:'
        printf ' %q' "${args[@]}"
        printf '\n'

        # Execute and capture exit code
        EXIT_CODE=0
        "${args[@]}" || EXIT_CODE=$?

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        # Exit with the same code to fail the step if tests fail
        exit $EXIT_CODE
