name: 'hitspec'
description: 'Run API tests with hitspec - plain text HTTP testing'
author: 'Abdul Hamid Achik'
branding:
  icon: 'zap'
  color: 'blue'

inputs:
  files:
    description: 'Files or directories to test (required)'
    required: true
  env:
    description: 'Environment name'
    required: false
    default: 'dev'
  env-file:
    description: 'Path to .env file for variable interpolation'
    required: false
  output:
    description: 'Output format (console, json, junit, tap, html)'
    required: false
    default: 'junit'
  output-file:
    description: 'Write output to file'
    required: false
  tags:
    description: 'Filter by tags (comma-separated)'
    required: false
  name:
    description: 'Filter by request name pattern'
    required: false
  timeout:
    description: 'Global timeout in milliseconds'
    required: false
  parallel:
    description: 'Run requests in parallel'
    required: false
    default: 'false'
  concurrency:
    description: 'Max concurrent requests when parallel is enabled'
    required: false
  bail:
    description: 'Stop on first failure'
    required: false
    default: 'false'
  verbose:
    description: 'Show detailed output'
    required: false
    default: 'false'
  insecure:
    description: 'Disable SSL certificate validation'
    required: false
    default: 'false'
  proxy:
    description: 'Proxy URL for requests'
    required: false
  stress:
    description: 'Enable stress testing mode'
    required: false
    default: 'false'
  duration:
    description: 'Stress test duration (e.g., 30s, 1m, 5m)'
    required: false
    default: '30s'
  rate:
    description: 'Target requests per second for stress testing'
    required: false
    default: '10'
  vus:
    description: 'Number of virtual users (alternative to rate)'
    required: false
  max-vus:
    description: 'Maximum concurrent requests in stress mode'
    required: false
  think-time:
    description: 'Think time between requests per VU'
    required: false
  ramp-up:
    description: 'Ramp-up time to reach target rate/VUs'
    required: false
  threshold:
    description: 'Pass/fail thresholds (e.g., "p95<200ms,errors<0.1%")'
    required: false
  profile:
    description: 'Stress profile name from hitspec.yaml'
    required: false
  version:
    description: 'hitspec version to use (e.g., v0.9.4 or latest)'
    required: false
    default: 'latest'

outputs:
  exit-code:
    description: 'Exit code from hitspec (0 = success, non-zero = failure)'
    value: ${{ steps.run-tests.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Install hitspec
      shell: bash
      run: |
        set -e

        VERSION="${{ inputs.version }}"

        # Resolve 'latest' to actual version
        if [ "$VERSION" = "latest" ]; then
          echo "Fetching latest version..."
          VERSION=$(curl -sL https://api.github.com/repos/abdul-hamid-achik/hitspec/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to fetch latest version"
            exit 1
          fi
          echo "Latest version: $VERSION"
        fi

        # Detect OS
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')

        # Detect architecture and normalize
        ARCH=$(uname -m)
        case $ARCH in
          x86_64)
            ARCH="amd64"
            ;;
          aarch64|arm64)
            ARCH="arm64"
            ;;
          *)
            echo "::error::Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

        echo "Platform: ${OS}_${ARCH}"

        # Strip 'v' prefix for download URL (goreleaser uses version without v)
        VERSION_NUM="${VERSION#v}"

        # Construct download URL
        if [ "$OS" = "windows" ]; then
          ARCHIVE="hitspec_${VERSION_NUM}_${OS}_${ARCH}.zip"
        else
          ARCHIVE="hitspec_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        fi

        URL="https://github.com/abdul-hamid-achik/hitspec/releases/download/${VERSION}/${ARCHIVE}"
        echo "Downloading: $URL"

        # Download and extract
        INSTALL_DIR="/usr/local/bin"
        if [ "$OS" = "windows" ]; then
          curl -sL "$URL" -o hitspec.zip
          unzip -o hitspec.zip hitspec.exe -d "$INSTALL_DIR"
          rm hitspec.zip
        else
          curl -sL "$URL" | tar xz -C "$INSTALL_DIR" hitspec
        fi

        # Verify installation
        hitspec version
        echo "hitspec installed successfully"

    - name: Run hitspec tests
      id: run-tests
      shell: bash
      # Pass inputs through the environment instead of interpolating them into
      # the bash string. Interpolating ${{ inputs.* }} directly into CMD and
      # `eval`-ing it was a shell-injection vector (e.g. a `files` value of
      # `x.http; rm -rf /` would have executed). Env passing + a bash array for
      # argv keeps every value a single literal argument.
      env:
        HITSPEC_FILES: ${{ inputs.files }}
        HITSPEC_ENV: ${{ inputs.env }}
        HITSPEC_ENV_FILE: ${{ inputs.env-file }}
        HITSPEC_OUTPUT: ${{ inputs.output }}
        HITSPEC_OUTPUT_FILE: ${{ inputs.output-file }}
        HITSPEC_TAGS: ${{ inputs.tags }}
        HITSPEC_NAME: ${{ inputs.name }}
        HITSPEC_TIMEOUT: ${{ inputs.timeout }}
        HITSPEC_PARALLEL: ${{ inputs.parallel }}
        HITSPEC_CONCURRENCY: ${{ inputs.concurrency }}
        HITSPEC_BAIL: ${{ inputs.bail }}
        HITSPEC_VERBOSE: ${{ inputs.verbose }}
        HITSPEC_INSECURE: ${{ inputs.insecure }}
        HITSPEC_PROXY: ${{ inputs.proxy }}
        HITSPEC_STRESS: ${{ inputs.stress }}
        HITSPEC_DURATION: ${{ inputs.duration }}
        HITSPEC_RATE: ${{ inputs.rate }}
        HITSPEC_VUS: ${{ inputs.vus }}
        HITSPEC_MAX_VUS: ${{ inputs.max-vus }}
        HITSPEC_THINK_TIME: ${{ inputs.think-time }}
        HITSPEC_RAMP_UP: ${{ inputs.ramp-up }}
        HITSPEC_THRESHOLD: ${{ inputs.threshold }}
        HITSPEC_PROFILE: ${{ inputs.profile }}
      run: |
        set -e

        # Build argv as a bash array so every value is a single literal argument
        # (no eval, no word-splitting, no injection).
        args=(hitspec run "$HITSPEC_FILES" --env "$HITSPEC_ENV" --output "$HITSPEC_OUTPUT" --no-color)

        [ -n "$HITSPEC_ENV_FILE" ]      && args+=(--env-file "$HITSPEC_ENV_FILE")
        [ -n "$HITSPEC_OUTPUT_FILE" ]   && args+=(--output-file "$HITSPEC_OUTPUT_FILE")
        [ -n "$HITSPEC_TAGS" ]          && args+=(--tags "$HITSPEC_TAGS")
        [ -n "$HITSPEC_NAME" ]          && args+=(--name "$HITSPEC_NAME")
        [ -n "$HITSPEC_TIMEOUT" ]       && args+=(--timeout "$HITSPEC_TIMEOUT")

        if [ "$HITSPEC_PARALLEL" = "true" ]; then
          args+=(--parallel)
          [ -n "$HITSPEC_CONCURRENCY" ] && args+=(--concurrency "$HITSPEC_CONCURRENCY")
        fi

        [ "$HITSPEC_BAIL" = "true" ]    && args+=(--bail)
        [ "$HITSPEC_VERBOSE" = "true" ] && args+=(--verbose)
        [ "$HITSPEC_INSECURE" = "true" ] && args+=(--insecure)
        [ -n "$HITSPEC_PROXY" ]         && args+=(--proxy "$HITSPEC_PROXY")

        if [ "$HITSPEC_STRESS" = "true" ]; then
          args+=(--stress --duration "$HITSPEC_DURATION" --rate "$HITSPEC_RATE" --no-progress)
          [ -n "$HITSPEC_VUS" ]        && args+=(--vus "$HITSPEC_VUS")
          [ -n "$HITSPEC_MAX_VUS" ]    && args+=(--max-vus "$HITSPEC_MAX_VUS")
          [ -n "$HITSPEC_THINK_TIME" ] && args+=(--think-time "$HITSPEC_THINK_TIME")
          [ -n "$HITSPEC_RAMP_UP" ]   && args+=(--ramp-up "$HITSPEC_RAMP_UP")
          [ -n "$HITSPEC_THRESHOLD" ] && args+=(--threshold "$HITSPEC_THRESHOLD")
          [ -n "$HITSPEC_PROFILE" ]   && args+=(--profile "$HITSPEC_PROFILE")
        fi

        printf 'Running:'
        printf ' %q' "${args[@]}"
        printf '\n'

        # Execute directly (no eval). Capture the exit code without `set -e`
        # aborting before we record it.
        EXIT_CODE=0
        "${args[@]}" || EXIT_CODE=$?

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"
