name: 'hitspec'
description: 'Run API tests with hitspec - plain text HTTP testing'
author: 'Abdul Hamid Achik'
branding:
  icon: 'zap'
  color: 'blue'

inputs:
  files:
    description: 'Files, directories or globs to test, separated by whitespace or newlines (e.g. "tests/ api/**/*.http"). A glob that matches nothing is an error. Paths containing spaces are not supported.'
    required: true
  env:
    description: 'Environment name. When empty, hitspec uses the defaultEnvironment from hitspec.yaml (or "dev").'
    required: false
    default: ''
  env-file:
    description: 'Path to .env file for variable interpolation'
    required: false
  output:
    description: 'Output format (console, json, junit, tap, html). json/junit/tap/html are written to output-file (default hitspec-results.<ext>) instead of the log.'
    required: false
    default: 'console'
  output-file:
    description: 'Write output to this file. Defaults to hitspec-results.<ext> for json, junit, tap and html.'
    required: false
  tags:
    description: 'Filter by tags (comma-separated)'
    required: false
  name:
    description: 'Filter by request name pattern'
    required: false
  timeout:
    description: 'Request timeout: a duration such as 30s or 1m, or a plain integer meaning milliseconds (e.g. 5000). Defaults to the hitspec default (30s).'
    required: false
  parallel:
    description: 'Run requests in parallel'
    required: false
    default: 'false'
  concurrency:
    description: 'Max concurrent requests when parallel is enabled'
    required: false
  bail:
    description: 'Stop on first failure'
    required: false
    default: 'false'
  verbose:
    description: 'Show detailed output'
    required: false
    default: 'false'
  insecure:
    description: 'Disable SSL certificate validation'
    required: false
    default: 'false'
  proxy:
    description: 'Proxy URL for requests'
    required: false
  stress:
    description: 'Enable stress testing mode'
    required: false
    default: 'false'
  duration:
    description: 'Stress test duration (e.g., 30s, 1m, 5m)'
    required: false
    default: '30s'
  rate:
    description: 'Target requests per second for stress testing'
    required: false
    default: '10'
  vus:
    description: 'Number of virtual users (alternative to rate)'
    required: false
  max-vus:
    description: 'Maximum concurrent requests in stress mode'
    required: false
  think-time:
    description: 'Think time between requests per VU'
    required: false
  ramp-up:
    description: 'Ramp-up time to reach target rate/VUs'
    required: false
  threshold:
    description: 'Pass/fail thresholds (e.g., "p95<200ms,errors<0.1%")'
    required: false
  profile:
    description: 'Stress profile name from hitspec.yaml'
    required: false
  version:
    description: 'hitspec release to install (e.g. v2.20.0 or latest). The archive is verified against the release checksums.txt.'
    required: false
    default: 'latest'

outputs:
  exit-code:
    description: 'Exit code from hitspec (0 = success, non-zero = failure)'
    value: ${{ steps.run-tests.outputs.exit-code }}
  report-file:
    description: 'Path of the report file written by hitspec (empty when output is console and no output-file was given)'
    value: ${{ steps.run-tests.outputs.report-file }}
  version:
    description: 'The hitspec version that was installed (e.g. v2.20.0)'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install hitspec
      id: install
      shell: bash
      # Inputs reach the script only through the environment, never through
      # ${{ }} interpolation inside the script body (script injection).
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu

        REPO="abdul-hamid-achik/hitspec"
        VERSION="${INPUT_VERSION:-latest}"

        fetch() {
          # fetch <url> <output-file>
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$2" "$1"
        }

        # Resolve 'latest' without the REST API (no rate limit): the
        # /releases/latest page redirects to /releases/tag/<tag>.
        if [ "$VERSION" = "latest" ]; then
          echo "Resolving latest hitspec release..."
          LOCATION=$(curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o /dev/null -w '%{url_effective}' "https://github.com/${REPO}/releases/latest" || true)
          VERSION="${LOCATION##*/}"
          case "$VERSION" in
            v[0-9]*) ;;
            *)
              # Fall back to the API (authenticated, so it is not rate limited).
              echo "Redirect lookup failed, trying the GitHub API..."
              if [ -n "${GH_TOKEN:-}" ]; then
                BODY=$(curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${REPO}/releases/latest" || true)
              else
                BODY=$(curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://api.github.com/repos/${REPO}/releases/latest" || true)
              fi
              VERSION=$(printf '%s' "$BODY" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n 1)
              ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to resolve the latest hitspec version"
            exit 1
          fi
        fi

        # Accept 2.20.0 as well as v2.20.0; reject anything that is not a plain
        # version string so it cannot alter the download URL.
        case "$VERSION" in
          v*) ;;
          *) VERSION="v${VERSION}" ;;
        esac
        if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9][0-9A-Za-z._+-]*$'; then
          echo "::error::Invalid version: $VERSION"
          exit 1
        fi
        VERSION_NUM="${VERSION#v}"
        echo "Version: $VERSION"

        case "$(uname -s)" in
          Linux)                    OS=linux ;;
          Darwin)                   OS=darwin ;;
          MINGW*|MSYS*|CYGWIN*)     OS=windows ;;
          *)
            echo "::error::Unsupported OS: $(uname -s)"
            exit 1
            ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)             ARCH=amd64 ;;
          aarch64|arm64)            ARCH=arm64 ;;
          *)
            echo "::error::Unsupported architecture: $(uname -m)"
            exit 1
            ;;
        esac
        echo "Platform: ${OS}_${ARCH}"

        if [ "$OS" = "windows" ]; then
          ARCHIVE="hitspec_${VERSION_NUM}_${OS}_${ARCH}.zip"
          BIN="hitspec.exe"
        else
          ARCHIVE="hitspec_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
          BIN="hitspec"
        fi
        BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

        TMP_ROOT="${RUNNER_TEMP:-$(mktemp -d)}"
        WORK="${TMP_ROOT}/hitspec-${VERSION}"
        rm -rf "$WORK"
        mkdir -p "$WORK/bin" "$WORK/dl"

        echo "Downloading ${BASE_URL}/${ARCHIVE}"
        fetch "${BASE_URL}/${ARCHIVE}" "$WORK/dl/$ARCHIVE"
        fetch "${BASE_URL}/checksums.txt" "$WORK/dl/checksums.txt"

        # Verify the archive against the checksums published with the release.
        EXPECTED=$(awk -v f="$ARCHIVE" '$2 == f || $2 == "*" f { print $1 }' "$WORK/dl/checksums.txt" | head -n 1)
        if [ -z "$EXPECTED" ]; then
          echo "::error::No checksum for $ARCHIVE in checksums.txt"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL=$(sha256sum "$WORK/dl/$ARCHIVE" | awk '{ print $1 }')
        else
          ACTUAL=$(shasum -a 256 "$WORK/dl/$ARCHIVE" | awk '{ print $1 }')
        fi
        EXPECTED=$(printf '%s' "$EXPECTED" | tr '[:upper:]' '[:lower:]')
        ACTUAL=$(printf '%s' "$ACTUAL" | tr '[:upper:]' '[:lower:]')
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::Checksum mismatch for $ARCHIVE (expected $EXPECTED, got $ACTUAL)"
          exit 1
        fi
        echo "Checksum OK ($ACTUAL)"

        if [ "$OS" = "windows" ]; then
          if command -v unzip >/dev/null 2>&1; then
            unzip -o -q "$WORK/dl/$ARCHIVE" "$BIN" -d "$WORK/bin"
          elif command -v 7z >/dev/null 2>&1; then
            7z x -y "-o$WORK/bin" "$WORK/dl/$ARCHIVE" "$BIN" >/dev/null
          else
            powershell -NoProfile -Command "Expand-Archive -Force -Path '$(cygpath -w "$WORK/dl/$ARCHIVE")' -DestinationPath '$(cygpath -w "$WORK/bin")'"
          fi
        else
          tar -xzf "$WORK/dl/$ARCHIVE" -C "$WORK/bin" "$BIN"
          chmod +x "$WORK/bin/$BIN"
        fi
        rm -rf "$WORK/dl"

        "$WORK/bin/$BIN" version

        BIN_DIR="$WORK/bin"
        if [ "$OS" = "windows" ] && command -v cygpath >/dev/null 2>&1; then
          BIN_DIR=$(cygpath -w "$BIN_DIR")
        fi
        echo "$BIN_DIR" >> "${GITHUB_PATH:-/dev/null}"
        echo "version=$VERSION" >> "${GITHUB_OUTPUT:-/dev/null}"
        echo "hitspec ${VERSION} installed to ${BIN_DIR}"

    - name: Run hitspec tests
      id: run-tests
      shell: bash
      # Pass inputs through the environment instead of interpolating them into
      # the script (shell injection). argv is built as a bash array and run
      # directly: no eval, so every value stays a single literal argument.
      # The variables are named INPUT_* on purpose: HITSPEC_* are the CLI's own
      # settings (HITSPEC_ENV, HITSPEC_TIMEOUT, ...) and a workflow may set
      # them on this step, so the action must not overwrite them.
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_ENV_FILE: ${{ inputs.env-file }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_BAIL: ${{ inputs.bail }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_INSECURE: ${{ inputs.insecure }}
        INPUT_PROXY: ${{ inputs.proxy }}
        INPUT_STRESS: ${{ inputs.stress }}
        INPUT_DURATION: ${{ inputs.duration }}
        INPUT_RATE: ${{ inputs.rate }}
        INPUT_VUS: ${{ inputs.vus }}
        INPUT_MAX_VUS: ${{ inputs.max-vus }}
        INPUT_THINK_TIME: ${{ inputs.think-time }}
        INPUT_RAMP_UP: ${{ inputs.ramp-up }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_PROFILE: ${{ inputs.profile }}
      run: |
        set -u

        is_true() {
          [ "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" = "true" ]
        }

        # --- files: whitespace/newline separated paths and globs ---------------
        # `set -f` stops the unquoted expansion below from globbing, so tokens
        # are only split; globs are expanded explicitly afterwards.
        shopt -s nullglob
        shopt -s globstar 2>/dev/null || true # bash >= 4; older bash treats ** like *
        files=()
        IFS_SAVE="$IFS"
        IFS=$' \t\r\n'
        set -f
        for token in $INPUT_FILES; do
          case "$token" in
            *[\*\?\[]*)
              set +f
              # shellcheck disable=SC2206 # intentional: expand the glob
              matches=( $token )
              set -f
              if [ "${#matches[@]}" -eq 0 ]; then
                echo "::error::files pattern '$token' matched nothing"
                exit 2
              fi
              files+=("${matches[@]}")
              ;;
            *)
              if [ ! -e "$token" ]; then
                echo "::error::files path '$token' does not exist"
                exit 2
              fi
              files+=("$token")
              ;;
          esac
        done
        set +f
        IFS="$IFS_SAVE"
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::The 'files' input is empty"
          exit 2
        fi

        # --- output format / report file ---------------------------------------
        FORMAT=$(printf '%s' "${INPUT_OUTPUT:-console}" | tr '[:upper:]' '[:lower:]')
        REPORT_FILE="$INPUT_OUTPUT_FILE"
        case "$FORMAT" in
          console) ;;
          json)  [ -n "$REPORT_FILE" ] || REPORT_FILE="hitspec-results.json" ;;
          junit) [ -n "$REPORT_FILE" ] || REPORT_FILE="hitspec-results.xml" ;;
          tap)   [ -n "$REPORT_FILE" ] || REPORT_FILE="hitspec-results.tap" ;;
          html)  [ -n "$REPORT_FILE" ] || REPORT_FILE="hitspec-results.html" ;;
          *)
            echo "::error::Unsupported output format '$FORMAT' (use console, json, junit, tap or html)"
            exit 2
            ;;
        esac

        # --- timeout: plain integers are milliseconds, durations pass through --
        TIMEOUT="$INPUT_TIMEOUT"
        if printf '%s' "$TIMEOUT" | grep -Eq '^[0-9]+$'; then
          TIMEOUT="${TIMEOUT}ms"
        fi

        args=(hitspec run "${files[@]}" --output "$FORMAT" --no-color)

        [ -n "$INPUT_ENV" ] && args+=(--env "$INPUT_ENV")
        [ -n "$INPUT_ENV_FILE" ] && args+=(--env-file "$INPUT_ENV_FILE")
        [ -n "$REPORT_FILE" ] && args+=(--output-file "$REPORT_FILE")
        [ -n "$INPUT_TAGS" ] && args+=(--tags "$INPUT_TAGS")
        [ -n "$INPUT_NAME" ] && args+=(--name "$INPUT_NAME")
        [ -n "$TIMEOUT" ] && args+=(--timeout "$TIMEOUT")

        if is_true "$INPUT_PARALLEL"; then
          args+=(--parallel)
          [ -n "$INPUT_CONCURRENCY" ] && args+=(--concurrency "$INPUT_CONCURRENCY")
        fi

        is_true "$INPUT_BAIL"       && args+=(--bail)
        is_true "$INPUT_VERBOSE"    && args+=(--verbose)
        is_true "$INPUT_INSECURE"   && args+=(--insecure)
        [ -n "$INPUT_PROXY" ] && args+=(--proxy "$INPUT_PROXY")

        if is_true "$INPUT_STRESS"; then
          args+=(--stress --no-progress)
          [ -n "$INPUT_DURATION" ]   && args+=(--duration "$INPUT_DURATION")
          [ -n "$INPUT_RATE" ]       && args+=(--rate "$INPUT_RATE")
          [ -n "$INPUT_VUS" ]        && args+=(--vus "$INPUT_VUS")
          [ -n "$INPUT_MAX_VUS" ]    && args+=(--max-vus "$INPUT_MAX_VUS")
          [ -n "$INPUT_THINK_TIME" ] && args+=(--think-time "$INPUT_THINK_TIME")
          [ -n "$INPUT_RAMP_UP" ]    && args+=(--ramp-up "$INPUT_RAMP_UP")
          [ -n "$INPUT_THRESHOLD" ]  && args+=(--threshold "$INPUT_THRESHOLD")
          [ -n "$INPUT_PROFILE" ]    && args+=(--profile "$INPUT_PROFILE")
        fi

        printf 'Running:'
        printf ' %q' "${args[@]}"
        printf '\n'

        # Run without eval and record the exit code; the step fails with it.
        EXIT_CODE=0
        "${args[@]}" || EXIT_CODE=$?

        echo "exit-code=$EXIT_CODE" >> "${GITHUB_OUTPUT:-/dev/null}"
        echo "report-file=$REPORT_FILE" >> "${GITHUB_OUTPUT:-/dev/null}"
        if [ -n "$REPORT_FILE" ]; then
          echo "Report written to $REPORT_FILE"
        fi
        exit "$EXIT_CODE"
