version: 1
name: studio_theme_picker

intent: |
  ctrl+t opens the theme picker overlay listing the available themes; ctrl+c
  closes it and exits cleanly (the picker is otherwise esc/enter-gated, which
  don't bind over a PTY).

imports:
  - ../actions/open_workspace.yml

target:
  cmd: ["${vars.bin}", "studio", "${vars.workspace}"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000

steps:
  - use: open_workspace
  - press: "ctrl+t"
  - wait:
      screen:
        contains: "Switch Theme"
      timeoutMs: 5000
  - snapshot: theme_picker
  - press: "ctrl+c"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: picker_opens
    description: ctrl+t opens the theme picker
    verify:
      screen:
        contains: "Switch Theme"
  - id: clean_exit
    description: ctrl+c closes the picker and exits
    verify:
      process:
        exitCode: 0
