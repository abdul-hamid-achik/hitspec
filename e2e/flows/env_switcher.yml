version: 1
name: studio_env_switcher

intent: |
  ctrl+e opens the environment switcher overlay populated from the workspace
  config; ctrl+c closes it and exits cleanly.

imports:
  - ../actions/open_workspace.yml

target:
  cmd: ["${vars.bin}", "studio", "${vars.workspace}"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000

steps:
  - use: open_workspace
  - press: "ctrl+e"
  - wait:
      screen:
        contains: "Switch Environment"
      timeoutMs: 5000
  - snapshot: env_switcher
  - press: "ctrl+c"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: switcher_opens
    description: ctrl+e opens the environment switcher
    verify:
      screen:
        contains: "Switch Environment"
  - id: clean_exit
    description: ctrl+c closes the switcher and exits
    verify:
      process:
        exitCode: 0
