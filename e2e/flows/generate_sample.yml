version: 1
name: studio_generate_sample

intent: |
  from the welcome screen a user can press g to scaffold a starter project, and
  the new example.http file appears in the sidebar and on disk.

target:
  cmd: ["${vars.bin}", "studio", "${vars.gendir}"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/gen && mkdir -p /tmp/hitspec-studio-e2e/gen"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "generate a sample project"
      timeoutMs: 8000
  - press: "g"
  - wait:
      screen:
        contains: "example.http"
      timeoutMs: 8000
  - snapshot: generated
  - press: "q"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: file_in_sidebar
    description: the scaffolded example.http appears in the file list
    verify:
      screen:
        contains: "example.http"
  - id: file_on_disk
    description: studio wrote example.http to the workspace directory
    verify:
      file:
        glob: /tmp/hitspec-studio-e2e/gen/example.http
        contains: "GET"
        timeoutMs: 5000
  - id: config_on_disk
    description: studio also wrote a hitspec.yaml config
    verify:
      file:
        glob: /tmp/hitspec-studio-e2e/gen/hitspec.yaml
        timeoutMs: 5000
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
