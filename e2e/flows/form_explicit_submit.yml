version: 1
name: studio_form_explicit_submit

intent: |
  the stress screen starts empty and never runs on enter: opening the fields and
  pressing enter only moves between them; nothing runs until s (or ctrl+s while
  editing) submits; esc leaves the fields and then goes back to the workspace.
  The target is a closed local port.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/formsubmit"]
  cwd: "."
  timeoutMs: 30000
  env:
    HOME: /tmp/hitspec-studio-e2e/home-form_explicit_submit

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/formsubmit && mkdir -p /tmp/hitspec-studio-e2e/formsubmit"
      timeoutMs: 10000
    - run: "printf '### P\\n# @name p\\nGET http://localhost:1/health\\n' > /tmp/hitspec-studio-e2e/formsubmit/p.http"
      timeoutMs: 10000

steps:
  - press: "2"
  - wait:
      screen:
        contains: "No stress test running"
      timeoutMs: 8000
  # enter opens the fields; a second enter moves to the next one. Neither runs.
  - press: "enter"
  - wait:
      screen:
        contains: "esc leave fields"
      timeoutMs: 5000
  - press: "enter"
  - wait:
      idle:
        quietForMs: 1000
      timeoutMs: 5000
  - snapshot: not_started
  # esc leaves the fields, the next esc goes back to the workspace
  - press: "esc"
  - wait:
      screen:
        contains: "e edit fields"
      timeoutMs: 5000
  # enter did not start anything, even after the round trip above
  - wait:
      screen:
        contains: "No stress test running"
      timeoutMs: 2000
  - press: "esc"
  - wait:
      screen:
        notContains: "STRESS"
      timeoutMs: 5000
  - wait:
      screen:
        contains: "WORKSPACE"
      timeoutMs: 5000
  # now run it explicitly: type a 2s duration, leave the fields, press s
  - press: "2"
  - press: "e"
  - type: "2s"
  - press: "esc"
  - wait:
      screen:
        contains: "e edit fields"
      timeoutMs: 5000
  - press: "s"
  - wait:
      screen:
        contains: "Running: true"
      timeoutMs: 8000
  - wait:
      screen:
        contains: "Last result"
      timeoutMs: 15000
  - use: quit_clean

outcomes:
  - id: explicit_submit_ran
    description: s started the run and it completed
    verify:
      screen:
        contains: "Last result"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
