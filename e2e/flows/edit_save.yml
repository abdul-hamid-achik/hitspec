version: 1
name: studio_edit_save

intent: |
  pressing e focuses the source editor; typed text marks the file modified; and
  ctrl+s saves it, clearing the modified flag and reloading the file. Runs in a
  scratch workspace so the edit is throwaway.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/edit"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/edit && mkdir -p /tmp/hitspec-studio-e2e/edit"
      timeoutMs: 10000
    - run: "printf '### Sample\\n# @name sample\\nGET https://example.com/\\n' > /tmp/hitspec-studio-e2e/edit/edit.http"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "edit.http"
      timeoutMs: 8000
  - press: "e"
  - type: "ZZTOP"
  - wait:
      screen:
        contains: "modified"
      timeoutMs: 5000
  - wait:
      screen:
        contains: "ZZTOP"
      timeoutMs: 5000
  - press: "ctrl+s"
  # Saving clears the modified flag (and exits edit mode). We assert the dirty
  # flag clears rather than the transient "opened" status — the file watcher
  # fires a "file event received" status on save that races and clobbers it.
  - wait:
      screen:
        notContains: "modified"
      timeoutMs: 10000
  - snapshot: saved
  - use: quit_clean

outcomes:
  - id: edit_marks_modified
    description: typing into the editor shows the inserted text
    verify:
      screen:
        contains: "ZZTOP"
  - id: saved_to_disk
    description: ctrl+s persists the edit to the file on disk
    verify:
      file:
        glob: /tmp/hitspec-studio-e2e/edit/edit.http
        contains: "ZZTOP"
        timeoutMs: 10000
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
