version: 1
name: studio_lost_edits

intent: |
  unsaved edits are never dropped silently: opening another file asks first;
  declining keeps the edit, confirming discards it (and the file on disk is
  unchanged); ctrl+c with a fresh edit asks too, and a second ctrl+c quits.
  Runs in a scratch workspace with two files.

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/lostedits"]
  cwd: "."
  timeoutMs: 25000
  env:
    HOME: /tmp/hitspec-studio-e2e/home-lost_edits

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/lostedits && mkdir -p /tmp/hitspec-studio-e2e/lostedits"
      timeoutMs: 10000
    - run: "printf '### A\\n# @name a\\nGET https://example.com/a\\n' > /tmp/hitspec-studio-e2e/lostedits/a.http"
      timeoutMs: 10000
    - run: "printf '### B\\n# @name b\\nGET https://example.com/b\\n' > /tmp/hitspec-studio-e2e/lostedits/b.http"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "b.http"
      timeoutMs: 8000
  - press: "e"
  - type: "ZZTOP"
  - wait:
      screen:
        contains: "modified"
      timeoutMs: 5000
  - press: "esc"
  - wait:
      screen:
        notContains: "esc cancel"
      timeoutMs: 5000
  # source -> response -> files, then down to b.http and try to open it
  - press: "tab"
  - press: "tab"
  - press: "down"
  - press: "enter"
  - wait:
      screen:
        contains: "Discard unsaved changes?"
      timeoutMs: 5000
  - snapshot: asked_before_opening
  # n keeps the edit
  - press: "n"
  - wait:
      screen:
        notContains: "Discard unsaved changes?"
      timeoutMs: 5000
  - wait:
      screen:
        contains: "modified"
      timeoutMs: 2000
  # enter + y discards it and opens b.http
  - press: "enter"
  - wait:
      screen:
        contains: "Discard unsaved changes?"
      timeoutMs: 5000
  - press: "y"
  - wait:
      screen:
        notContains: "modified"
      timeoutMs: 8000
  - wait:
      screen:
        contains: "opened b.http"
      timeoutMs: 8000
  # a fresh edit, then ctrl+c: asks, and a second ctrl+c quits anyway
  - press: "e"
  - type: "QQ"
  - wait:
      screen:
        contains: "modified"
      timeoutMs: 5000
  - press: "esc"
  - wait:
      screen:
        notContains: "esc cancel"
      timeoutMs: 5000
  - press: "ctrl+c"
  - wait:
      screen:
        contains: "Discard unsaved changes?"
      timeoutMs: 5000
  - press: "ctrl+c"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: discarded_edit_never_reached_disk
    description: a.http on disk still has no edit
    verify:
      command:
        run: "! grep -q ZZTOP /tmp/hitspec-studio-e2e/lostedits/a.http && ! grep -q QQ /tmp/hitspec-studio-e2e/lostedits/b.http"
  - id: clean_exit
    description: the second ctrl+c exits with status code 0
    verify:
      process:
        exitCode: 0
