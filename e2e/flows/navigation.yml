version: 1
name: studio_navigation

intent: |
  the number keys switch between studio's screens, and the active screen is
  reflected in the top bar.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "${vars.workspace}"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000

steps:
  - wait:
      screen:
        contains: "WORKSPACE"
      timeoutMs: 8000
  - press: "2"
  - wait:
      screen:
        contains: "STRESS"
      timeoutMs: 5000
  - snapshot: stress
  - press: "6"
  - wait:
      screen:
        contains: "HISTORY"
      timeoutMs: 5000
  - press: "1"
  - wait:
      screen:
        contains: "WORKSPACE"
      timeoutMs: 5000
  - use: quit_clean

outcomes:
  # Intermediate screens (STRESS, HISTORY) are asserted by the wait steps above.
  - id: back_on_workspace
    description: navigating with the number keys returns to the workspace screen
    verify:
      screen:
        contains: "WORKSPACE"
  - id: workspace_files
    description: the workspace still lists its files after navigating
    verify:
      screen:
        contains: "sample.http"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
