version: 1
name: studio_delete_file

intent: |
  deleting a file asks for confirmation; confirming with y removes it and
  returns to the welcome screen.

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/delfile"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/delfile && mkdir -p /tmp/hitspec-studio-e2e/delfile"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "generate a sample project"
      timeoutMs: 8000
  - press: "n"
  - wait:
      screen:
        contains: "scratch"
      timeoutMs: 8000
  - press: "D"
  - wait:
      screen:
        contains: "Delete file?"
      timeoutMs: 5000
  - snapshot: confirm
  - press: "y"
  - wait:
      screen:
        contains: "generate a sample project"
      timeoutMs: 8000
  - press: "q"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  # Deletion is proven by the welcome card returning (0 files). Note: the
  # "deleted <file>" toast/status legitimately names the file, so a
  # notContains "scratch" check would be wrong here.
  - id: back_to_welcome
    description: deleting the only file returns to the welcome screen
    verify:
      screen:
        contains: "generate a sample project"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
