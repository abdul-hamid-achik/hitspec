version: 1
name: studio_import_scratch

intent: |
  the import screen converts input into a scratch .http file: submit the
  pre-filled curl form and the imported request opens in the workspace. Runs in
  a scratch workspace so the generated file is throwaway.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/import"]
  cwd: "."
  timeoutMs: 15000
  # Isolate ~/.hitspec (history, cookie jar) to a throwaway HOME so the run
  # never reads or writes the real one. target.env applies to the studio
  # process only; preconditions still build with the real HOME.
  env:
    HOME: /tmp/hitspec-studio-e2e/home-import_scratch

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/import && mkdir -p /tmp/hitspec-studio-e2e/import"
      timeoutMs: 10000

steps:
  - press: "7"
  - wait:
      screen:
        contains: "IMPORT"
      timeoutMs: 8000
  # the form starts empty (format defaults to curl): fill in the input, then
  # submit explicitly with ctrl+s (enter only moves between fields)
  - press: "e"
  - press: "down"
  - type: "curl https://example.com"
  - press: "ctrl+s"
  - wait:
      screen:
        contains: "imported-"
      timeoutMs: 8000
  - snapshot: imported
  - use: quit_clean

outcomes:
  - id: import_created_file
    description: importing opens a generated scratch file (status reports it)
    verify:
      screen:
        contains: "imported-"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
