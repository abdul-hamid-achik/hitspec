version: 1
name: studio_theme_flag

intent: |
  studio accepts a --theme flag and launches the workspace with that color
  theme applied, without error.

target:
  cmd: ["${vars.bin}", "studio", "--theme", "Dracula", "${vars.workspace}"]
  cwd: "."
  timeoutMs: 15000
  # Isolate ~/.hitspec (history, cookie jar) to a throwaway HOME so the run
  # never reads or writes the real one. target.env applies to the studio
  # process only; preconditions still build with the real HOME.
  env:
    HOME: /tmp/hitspec-studio-e2e/home-theme_flag

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000

steps:
  - wait:
      screen:
        contains: "sample.http"
      timeoutMs: 8000
  - snapshot: themed
  - press: "q"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: launches_with_theme
    description: the workspace renders normally when a theme is selected via --theme
    verify:
      screen:
        contains: "sample.http"
  - id: still_studio
    description: branding is intact under the alternate theme
    verify:
      screen:
        contains: "hitspec studio"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
