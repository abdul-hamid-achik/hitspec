version: 1
name: studio_small_terminal

intent: |
  on an 80x24 terminal the request list shows its rows, and after r the response
  is on screen without having to move focus (the stacked layout switches its
  main panel to the response). The target port is closed, so the response is a
  deterministic connection error.

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/small"]
  cwd: "."
  timeoutMs: 20000
  env:
    HOME: /tmp/hitspec-studio-e2e/home-small_terminal

terminal:
  cols: 80
  rows: 24
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/small && mkdir -p /tmp/hitspec-studio-e2e/small"
      timeoutMs: 10000
    - run: "printf '### Alpha\\n# @name alpha\\nGET http://127.0.0.1:1/a\\n\\n### Beta\\n# @name beta\\nGET http://127.0.0.1:1/b\\n\\n### Gamma\\n# @name gamma\\nGET http://127.0.0.1:1/c\\n' > /tmp/hitspec-studio-e2e/small/s.http"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "s.http"
      timeoutMs: 8000
  # all three requests are listed
  - wait:
      screen:
        contains: "gamma"
      timeoutMs: 5000
  - snapshot: request_rows
  - press: "tab"
  - press: "r"
  - wait:
      screen:
        contains: "connection refused"
      timeoutMs: 10000
  - snapshot: response_visible
  - press: "ctrl+c"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: all_requests_listed
    description: the third request is visible on an 80x24 terminal
    verify:
      screen:
        contains: "gamma"
  - id: response_visible_after_run
    description: the run result is on screen without moving focus by hand
    verify:
      screen:
        contains: "connection refused"
  - id: clean_exit
    description: ctrl+c exits the app with status code 0
    verify:
      process:
        exitCode: 0
