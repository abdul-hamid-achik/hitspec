version: 1
name: serve_environments_config
intent: The serve API exposes environments and persists configuration changes.
mode: normal
outcomes:
  - id: config_roundtrips_timeout
    description: a PUT to config is reflected by the subsequent GET
    verify:
      httpJson:
        url: ${vars.apiBase}/config
        jsonPath: $.timeout
        equals: 30000
  - id: environment_variable_persisted
    description: a variable written to the dev environment is read back
    verify:
      httpJson:
        url: ${vars.apiBase}/environments/dev
        jsonPath: $.variables.baseUrl
        contains: localhost
  - id: config_no_server_errors
    description: config and environment reads/writes do not 5xx
    verify:
      noFailedRequests:
        urlContains: /api/v1
steps:
  - open: ${vars.apiBase}/system/info
  - request:
      method: PUT
      url: ${vars.apiBase}/config
      body:
        defaultEnvironment: dev
        timeout: 30000
        retries: 1
      expectStatus: 200
      assign: cfg
  - request:
      method: PUT
      url: ${vars.apiBase}/environments/dev
      body:
        variables:
          baseUrl: http://localhost:4517
      expectStatus: 200
      assign: putEnv
  - request:
      method: PUT
      url: ${vars.apiBase}/environments/active
      body:
        name: dev
      expectStatus: 204
      assign: activeEnv
contractHash: sha256:df16a8634bc788d46a787cd9522417a8dfda1776fa6c1b6311f0b9d29cba1446
