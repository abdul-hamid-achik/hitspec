version: 1
name: serve_import_export
intent: The serve API imports a curl command into .http and exports a request back to curl.
mode: normal
outcomes:
  - id: import_curl_converts
    description: importing a curl command yields generated .http content
    verify:
      script:
        runtime: node
        run: >
          const res = await fetch('http://localhost:4517/api/v1/import/curl', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: 'curl https://example.com/api' }),
          });

          const j = await res.json();

          return {
            ok: res.status === 200 && typeof j.content === 'string' && j.content.includes('example.com'),
            evidence: `status=${res.status} requestCount=${j.requestCount}`,
          };
  - id: import_no_server_errors
    description: the import endpoint does not 5xx
    verify:
      noFailedRequests:
        urlContains: /api/v1/import
steps:
  - open: ${vars.apiBase}/system/info
  - request:
      method: POST
      url: ${vars.apiBase}/import/curl
      body:
        command: curl https://example.com/api
      expectStatus: 200
      assign: imported
contractHash: sha256:c8a453b6cd179f4dd54cce2d348b14b8e6974ac02c3a6bf6a3c331f0a1fe92f6
