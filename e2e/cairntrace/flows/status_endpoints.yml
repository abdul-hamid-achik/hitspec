version: 1
name: serve_status_endpoints
intent: The serve API reports stress, mock, and record status without a session running.
mode: normal
outcomes:
  - id: stress_idle
    description: stress status reports not running before any test starts
    verify:
      httpJson:
        url: ${vars.apiBase}/stress/status
        jsonPath: $.running
        equals: false
  - id: record_idle
    description: record status reports not running
    verify:
      httpJson:
        url: ${vars.apiBase}/record/status
        jsonPath: $.running
        equals: false
  - id: status_no_server_errors
    description: the module status endpoints do not 5xx
    verify:
      noFailedRequests:
        urlContains: /api/v1
steps:
  - open: ${vars.apiBase}/stress/status
contractHash: sha256:196c1d21a28dd942c7ced0a93e2f05ca1c40632c9b5c4e245ac077da8830a471
