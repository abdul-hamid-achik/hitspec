version: 1
name: serve_workspace_files
intent: The serve API lists the workspace and supports the file create/read/delete cycle.
mode: normal
outcomes:
  - id: workspace_reports_requests
    description: the workspace endpoint reports a total request count
    verify:
      httpJson:
        url: ${vars.apiBase}/workspace
        jsonPath: $.totalRequests
        atLeast: 0
  - id: file_crud_no_server_errors
    description: create, read, and delete a file with no 4xx/5xx along the way
    verify:
      noFailedRequests:
        urlContains: /api/v1/files
steps:
  - open: ${vars.apiBase}/system/info
  - request:
      method: POST
      url: ${vars.apiBase}/files
      body:
        path: cairn-crud.http
        content: |
          ### Ping
          GET http://localhost:4517/api/v1/system/info

          >>>
          expect status 200
          <<<
      expectStatus: 201
      assign: created
  - request:
      method: GET
      url: ${vars.apiBase}/files/raw/cairn-crud.http
      expectStatus: 200
      assign: raw
  - request:
      method: DELETE
      url: ${vars.apiBase}/files/cairn-crud.http
      expectStatus: 204
      assign: deleted
contractHash: sha256:1f964157c9a82b44470893963055fef7a48a2de6070881843719d5171365fb2d
