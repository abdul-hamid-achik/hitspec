version: 1
name: serve_system_info
intent: The serve API reports system info over HTTP.
mode: normal
outcomes:
  - id: reports_go_version
    description: the system info endpoint returns runtime details
    verify:
      httpJson:
        url: ${vars.apiBase}/system/info
        jsonPath: $.goVersion
        contains: go
  - id: no_server_errors
    description: the system info request does not 5xx
    verify:
      noFailedRequests:
        urlContains: /api/v1/system/info
steps:
  - open: ${vars.apiBase}/system/info
contractHash: sha256:88f1ba7224f70660e89b8c548efae04b399b3c2b6e2ad79ed1ea4076ac779eda
