version: 1
name: studio_settings_save

intent: |
  the settings form persists configuration: edit the timeout field and submit,
  and the config dump reflects the new value. Runs in a scratch workspace so the
  written hitspec.yaml is throwaway.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/settings"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/settings && mkdir -p /tmp/hitspec-studio-e2e/settings"
      timeoutMs: 10000
    - run: "printf '### S\\n# @name s\\nGET https://example.com/\\n' > /tmp/hitspec-studio-e2e/settings/s.http"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "s.http"
      timeoutMs: 8000
  - press: "9"
  - wait:
      screen:
        contains: "Configuration"
      timeoutMs: 5000
  - press: "e"
  # fields: 0 default env, 1 timeout ms, 2 retries. retries is empty by default,
  # so it appends cleanly with no prefill to clear.
  - press: "down"
  - press: "down"
  - type: "7"
  - press: "enter"
  - wait:
      screen:
        contains: "Retries: 7"
      timeoutMs: 5000
  - snapshot: saved
  - use: quit_clean

outcomes:
  - id: retries_persisted
    description: the edited retries value is reflected in the config dump
    verify:
      screen:
        contains: "Retries: 7"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
