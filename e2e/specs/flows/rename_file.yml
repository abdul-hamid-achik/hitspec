version: 1
name: studio_rename_file

intent: |
  the command palette renames the selected file: filter to "Rename", clear the
  pre-filled path, type a new one, and submit; the renamed file appears. Runs in
  a scratch workspace.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/rename"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/rename && mkdir -p /tmp/hitspec-studio-e2e/rename"
      timeoutMs: 10000
    - run: "printf '### R\\n# @name r\\nGET https://example.com/\\n' > /tmp/hitspec-studio-e2e/rename/before.http"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "before.http"
      timeoutMs: 8000
  - press: "ctrl+p"
  - wait:
      screen:
        contains: "Command Palette"
      timeoutMs: 5000
  - press: "/"
  - type: "Rename"
  - wait:
      screen:
        contains: "1 item"
      timeoutMs: 5000
  - press: "enter"
  - wait:
      screen:
        contains: "Rename file"
      timeoutMs: 5000
  # the prompt is pre-filled with the current path; clear it then type the new one
  - press: "ctrl+u"
  - type: "after.http"
  - press: "enter"
  - wait:
      screen:
        contains: "renamed"
      timeoutMs: 5000
  - wait:
      screen:
        contains: "after.http"
      timeoutMs: 5000
  - snapshot: renamed
  - use: quit_clean

outcomes:
  - id: file_renamed
    description: renaming reports success and the new name appears
    verify:
      screen:
        contains: "after.http"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
