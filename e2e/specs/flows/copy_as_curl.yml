version: 1
name: studio_copy_as_curl

intent: |
  the command palette renders the selected request in another client format:
  filter to "Copy request as curl" and run it; the status line confirms the
  export (and the rendered snippet is surfaced for review).

imports:
  - ../actions/open_workspace.yml
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "${vars.workspace}"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000

steps:
  - use: open_workspace
  - press: "ctrl+p"
  - wait:
      screen:
        contains: "Command Palette"
      timeoutMs: 5000
  - press: "/"
  # single-word unique token (only the curl command contains "curl"); wait for
  # the filtered command to render before enter so the keystrokes have settled
  - type: "as curl"
  - wait:
      screen:
        contains: "1 item"
      timeoutMs: 5000
  - press: "enter"
  - wait:
      screen:
        contains: "as curl"
      timeoutMs: 8000
  - snapshot: exported
  - use: quit_clean

outcomes:
  - id: exported_as_curl
    description: the status line confirms the curl export
    verify:
      screen:
        contains: "as curl"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
