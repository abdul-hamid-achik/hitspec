version: 1
name: studio_history_after_run

intent: |
  a run is persisted to history: after running a file, the history screen (6)
  lists that file's run. Uses a closed local port so the run is deterministic.

imports:
  - ../actions/quit_clean.yml

target:
  cmd: ["${vars.bin}", "studio", "/tmp/hitspec-studio-e2e/hist"]
  cwd: "."
  timeoutMs: 15000
  # isolate ~/.hitspec (history/cookies) to a throwaway HOME — no reading
  # or polluting the user's real run history; preconditions keep real HOME
  env:
    HOME: /tmp/hitspec-studio-e2e/home

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000
    - run: "rm -rf /tmp/hitspec-studio-e2e/hist && mkdir -p /tmp/hitspec-studio-e2e/hist"
      timeoutMs: 10000
    - run: "printf '### Histping\\n# @name histping\\nGET http://localhost:1/health\\n\\n>>>\\nexpect status 200\\n<<<\\n' > /tmp/hitspec-studio-e2e/hist/histping.http"
      timeoutMs: 10000

steps:
  - wait:
      screen:
        contains: "histping.http"
      timeoutMs: 8000
  - press: "R"
  - wait:
      screen:
        contains: "run complete"
      timeoutMs: 8000
  - press: "6"
  - wait:
      screen:
        contains: "HISTORY"
      timeoutMs: 5000
  - wait:
      screen:
        contains: "histping.http"
      timeoutMs: 5000
  - snapshot: history
  - use: quit_clean

outcomes:
  - id: run_in_history
    description: the just-run file appears in the persisted history list
    verify:
      screen:
        contains: "histping.http"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
