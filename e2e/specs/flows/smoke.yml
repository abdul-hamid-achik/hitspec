version: 1
name: studio_smoke

intent: |
  a user can launch hitspec studio on a workspace, see the file list and
  navigation strip, and quit cleanly with q.

target:
  cmd: ["${vars.bin}", "studio", "${vars.workspace}"]
  cwd: "."
  timeoutMs: 15000

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color
  alternateScreen: require

preconditions:
  commands:
    - run: "go build -o ./bin/hitspec ../apps/cli"
      timeoutMs: 120000

steps:
  - wait:
      screen:
        contains: "hitspec studio"
      timeoutMs: 8000
  - wait:
      screen:
        contains: "sample.http"
      timeoutMs: 5000
  - snapshot: workspace
  - press: "q"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: studio_branding
    description: the top bar shows the hitspec studio branding (not "TUI")
    verify:
      screen:
        contains: "hitspec studio"
  - id: no_tui_jargon
    description: the user-facing UI never calls itself a "TUI"
    verify:
      screen:
        notContains: "hitspec TUI"
  - id: file_listed
    description: the sidebar lists the workspace .http file
    verify:
      screen:
        contains: "sample.http"
  - id: nav_strip
    description: the numbered screen navigation strip is visible
    verify:
      screen:
        contains: "stress"
  - id: clean_exit
    description: q exits the app with status code 0
    verify:
      process:
        exitCode: 0
